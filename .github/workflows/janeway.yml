name: Janeway

on:
  workflow_run:
    workflows: ['Tuvok']
    types: [completed]
    branches:
      - alpha
      - beta
      - main

concurrency:
  group: janeway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  issues: read
  pull-requests: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: 🖖 Establish Communications (Checkout)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.repository.full_name }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: 🔄 Synchronize main and tags
        shell: bash
        run: |
          set -euo pipefail
      
          git fetch origin main:refs/remotes/origin/main
          git fetch --tags --force
      
          if [[ "$(git branch --show-current)" == "main" ]]; then
            git reset --hard origin/main
          else
            git branch -f main origin/main
          fi

      - name: 🔎 Debug local refs
        shell: bash
        run: |
          git branch -a
          git rev-parse --verify main
          git rev-parse --verify beta
          git rev-parse --verify alpha
    
      - name: 🔐 Open Secure Channel (Configure SSH for Deploy-Key)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RELEASE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote set-url origin "git@github.com:${{ github.repository }}.git"

      - name: 🧪 Load PNPM Protocols (pnpm 10.15.0)
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: 🖥️ Initialize Starfleet Node (22.18.x + pnpm cache)
        uses: actions/setup-node@v5
        with:
          node-version: '22.18.x'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@RMajewski'

      - name: 📦 Replicate Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛠️ Build Artifacts
        run: pnpm run build

      - name: 🏷️ Determine dist-tag by branch
        id: tag
        shell: bash
        run: |
          branch_name="${{ github.event.workflow_run.head_branch }}"

          if [[ "${branch_name}" == "main" ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          elif [[ "${branch_name}" == "beta" ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Engage Janeway Drive (Publish to GitHub Packages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release --no-git-checks --tag "${{ steps.tag.outputs.tag }}"
